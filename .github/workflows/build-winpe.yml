name: Build WinPE ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ADK and WinPE add-on
        shell: pwsh
        run: choco install windows-adk windows-adk-winpe -y --no-progress

      - name: Build WinPE ISO
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          copype amd64 C:\WinPE_amd64
          makewinpemedia /iso C:\WinPE_amd64 C:\WinPE_amd64.iso

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "winpe-${{ github.run_number }}"
          name: "Windows PE Build ${{ github.run_number }}"
          files: C:\WinPE_amd64\WinPE_amd64.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
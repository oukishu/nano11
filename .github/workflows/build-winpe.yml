name: Build WinPE ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set date tag
        id: meta
        shell: pwsh
        run: |
          $d = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          "tag=$d" >> $env:GITHUB_OUTPUT

      - name: Install ADK (Deployment Tools only) + WinPE add-on
        shell: pwsh
        env:
          # 从 https://learn.microsoft.com/en-us/windows-hardware/get-started/adk-install
          # 复制 "Download the Windows ADK" 和 "Download the Windows PE add-on" 的链接
          ADK_URL: https://go.microsoft.com/fwlink/?linkid=2289980
          WINPE_URL: https://go.microsoft.com/fwlink/?linkid=2289981
        run: |
          Invoke-WebRequest $env:ADK_URL -OutFile adksetup.exe
          Invoke-WebRequest $env:WINPE_URL -OutFile adkwinpesetup.exe

          Start-Process .\adksetup.exe -Wait -ArgumentList '/features','OptionId.DeploymentTools','/quiet','/norestart','/ceip','off'
          Start-Process .\adkwinpesetup.exe -Wait -ArgumentList '/features','OptionId.WindowsPreinstallationEnvironment','/quiet','/norestart','/ceip','off'

      - name: Build WinPE ISO
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          if errorlevel 1 exit /b 1
          call copype amd64 C:\WinPE_amd64
          if errorlevel 1 exit /b 1
          call MakeWinPEMedia /ISO C:\WinPE_amd64 C:\WinPE_amd64\WinPE_x64.iso
          if errorlevel 1 (
            echo makewinpemedia failed
            dir C:\WinPE_amd64
            exit /b 1
          )
          if not exist C:\WinPE_amd64\WinPE_x64.iso (
            echo ISO not created
            dir C:\
            exit /b 1
          )

      - name: Copy ISO into workspace
        shell: pwsh
        run: Copy-Item C:\WinPE_amd64\WinPE_x64.iso "$env:GITHUB_WORKSPACE\WinPE_amd64.iso"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "winpe-${{ steps.meta.outputs.tag }}"
          name: "Windows PE Build ${{ steps.meta.outputs.tag }}"
          body: "Windows PE (amd64) ISO built by GitHub Actions."
          files: WinPE_amd64.iso
          fail_on_unmatched_files: true